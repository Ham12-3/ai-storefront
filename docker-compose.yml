services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_storefront
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront_local_only
    ports:
      - '5432:5432'
    volumes:
      - storefront_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storefront -d ai_storefront']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storefront_postgres:
